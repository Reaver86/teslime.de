name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install, test, build, and upload site
        uses: withastro/action@v6
        with:
          node-version: 24
          build-cmd: npm run verify
        env:
          SITE_URL: https://reaver86.github.io
          BASE_PATH: /teslime.de
          # Use the Maps link fallback on the preview domain.
          PUBLIC_GOOGLE_MAPS_API_KEY: ""

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
